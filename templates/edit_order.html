{% extends 'base.html' %}{% block content %}<div class="eyebrow">NŌA / EDIT ORDER</div><h1>تعديل {{o.code}}</h1><p class="muted">يُسمح للأدمن بالتعديل حتى قبل مرحلة تم التجهيز. الصور الجديدة تُضاف إلى الصور الحالية.</p><form class="panel edit-form" method="post" enctype="multipart/form-data"><div class="field"><label>المنتج</label><select name="product_id" id="edit-product">{% for p in products %}<option value="{{p.id}}" data-price="{{p.price}}" data-colors="{{p.colors}}" data-sizes="{{p.sizes}}" {{'selected' if p.id==o.product_id}}>{{p.name}}</option>{% endfor %}</select></div><div class="grid2"><div class="field"><label>اللون</label><select name="color" id="edit-color" data-current="{{o.color}}"></select></div><div class="field"><label>القياس</label><select name="size" id="edit-size" data-current="{{o.size}}"></select></div></div><div class="field"><label>الكمية</label><input name="qty" type="number" min="1" max="100" value="{{o.qty}}"></div><div class="field"><label>صور إضافية</label><input name="images" type="file" accept="image/png,image/jpeg,image/webp" multiple></div><div class="photos">{% for im in images %}<img src="/media/{{im}}">{% endfor %}</div><div class="field"><label>ملاحظات التصميم</label><textarea name="design_notes">{{o.design_notes or ''}}</textarea></div><div class="grid2"><div class="field"><label>اسم الزبون</label><input name="customer" required value="{{o.customer}}"></div><div class="field"><label>الهاتف</label><input name="phone" required value="{{o.phone}}"></div><div class="field"><label>المحافظة</label><input name="governorate" value="{{o.governorate or ''}}"></div><div class="field"><label>المنطقة</label><input name="area" value="{{o.area or ''}}"></div></div><div class="field"><label>العنوان</label><input name="address" value="{{o.address or ''}}"></div><div class="field"><label>نقطة دالة</label><input name="landmark" value="{{o.landmark or ''}}"></div><div class="field"><label>ملاحظات</label><textarea name="notes">{{o.notes or ''}}</textarea></div><div class="field"><label>طريقة الدفع</label><select name="payment_method">{% for val,label in [('cod','عند الاستلام'),('mastercard','ماستر كارد'),('bank','تحويل'),('qi','Qi'),('none','بدون دفعة')] %}<option value="{{val}}" {{'selected' if o.payment_method==val}}>{{label}}</option>{% endfor %}</select></div><div class="grid2"><div class="field"><label>التوصيل</label><input name="shipping" type="number" min="0" value="{{o.shipping}}"></div><div class="field"><label>المدفوع</label><input name="paid" type="number" min="0" value="{{o.paid}}"></div></div><button class="btn full">حفظ التعديلات</button></form><script>const ep=document.getElementById('edit-product');function eVariants(){const opt=ep.selectedOptions[0];for(const [id,key] of [['edit-color','colors'],['edit-size','sizes']]){const el=document.getElementById(id),old=el.dataset.current;el.replaceChildren();for(const v of ['',...(opt.dataset[key]||'').split(',')]){const o=document.createElement('option');o.value=v;o.textContent=v||'تخطي';el.append(o)}el.value=[...el.options].some(x=>x.value===old)?old:'';el.dataset.current=el.value}}ep.addEventListener('change',()=>{document.getElementById('edit-color').dataset.current='';document.getElementById('edit-size').dataset.current='';eVariants()});eVariants();</script>{% endblock %}
