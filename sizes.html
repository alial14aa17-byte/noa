{% extends 'base.html' %}{% block content %}<div class="eyebrow">NŌA / SIZE GUIDE</div><h1>حاسبة القياسات</h1><p class="muted">صفحة مستقلة. اختر نوع القطعة وأدخل الوزن والطول. الاقتراح تقريبي، وجدول القطعة الفعلي هو المرجع.</p><div class="panel size-page"><div class="field"><label>نوع القطعة</label><select id="type"><option value="regular">هودي ريكولر</option><option value="oversize">هودي أوفر سايز</option><option value="zip">هودي بسحاب</option><option value="sweater">سويتر رقبة حلقة</option></select></div><div class="grid2"><div class="field"><label>الوزن (كغم)</label><input id="w" type="number" min="30" max="200" placeholder="مثلاً 85"></div><div class="field"><label>الطول (سم) — اختياري</label><input id="h" type="number" min="120" max="230" placeholder="مثلاً 184"></div></div><button type="button" onclick="recommend()" class="btn full">حساب القياس</button><div id="size-result" class="size-result" hidden></div><div id="size-table"></div></div><script>const charts={regular:[['M',50,60,54,72,74],['L',60,70,56,74,75],['XL',70,80,58,75,76],['XXL',80,95,60,76,77],['3XL',95,105,62,77,78]],oversize:[['M',50,70,58,77,79],['L',70,85,60,79,80],['XL',85,100,62,80,81],['XXL',100,115,64,81,82],['3XL',115,130,66,82,83]],zip:[['M',50,70,56,78,78],['L',70,85,58,79,79],['XL',85,95,60,80,80],['XXL',95,105,62,81,81],['3XL',105,115,64,82,82]],sweater:[['M',50,55,55,74,76],['L',65,75,57,76,77],['XL',75,85,59,77,78],['XXL',85,95,61,78,79],['3XL',100,105,63,79,81]]};function draw(){let r=charts[document.getElementById('type').value];document.getElementById('size-table').innerHTML='<h3>جدول قياسات القطعة</h3><div class="table-scroll"><table class="measurement"><tr><th>القياس</th><th>الوزن التقريبي</th><th>الصدر</th><th>الطول</th><th>الردن</th></tr>'+r.map(x=>'<tr><td>'+x[0]+'</td><td>'+x[1]+'–'+x[2]+' كغم</td><td>'+x[3]+' سم</td><td>'+x[4]+' سم</td><td>'+x[5]+' سم</td></tr>').join('')+'</table></div>'}function recommend(){let w=+document.getElementById('w').value,h=+document.getElementById('h').value,rows=charts[document.getElementById('type').value],el=document.getElementById('size-result');el.hidden=false;if(!w||w<30||w>200||(h&&(h<120||h>230))){el.textContent='أدخل وزناً صحيحاً وطولاً صحيحاً إن أضفته';return}let matches=rows.filter(r=>w>=r[1]&&w<=r[2]);el.innerHTML=matches.length?'<small>القياس المقترح بحسب الوزن</small><strong>'+matches.map(r=>r[0]).join(' / ')+'</strong><p>الطول لا يدخل في التوصية لأن الجداول المرسلة لا تحتوي نطاقات طول الجسم. قارن طول القطعة وعرض الصدر قبل الاعتماد.</p>':'الوزن خارج النطاقات المحددة لهذا المنتج؛ راجع القياسات يدوياً.'}document.getElementById('type').addEventListener('change',draw);draw()</script>{% endblock %}
