<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>nōa | إدارة الطلبات</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="shell"><aside class="sidebar"><div class="brand">nōa<sup>®</sup></div><small>نظام إدارة الطلبات</small><nav><a href="/">⌂ الرئيسية</a><a href="/orders">▤ الطلبات</a><a href="/orders/new">＋ رفع طلب</a><a href="/earnings">◉ الأرباح</a>{% if user.role=='owner' %}<a href="/manage">⚙ إدارة النظام</a>{% endif %}</nav><form method="post" action="/logout"><button class="outline">تسجيل الخروج</button></form></aside><main><header><div><b>nōa®</b><small>{{'لوحة المدير العام' if user.role=='owner' else 'لوحة الأدمن'}}</small></div><span class="user">{{user.name}}</span></header><div class="content">{% block content %}{% endblock %}</div></main><footer class="mobile-nav"><a href="/">الرئيسية</a><a href="/orders">طلباتي</a><a href="/orders/new">+ طلب</a><a href="/earnings">أرباحي</a><a href="/manage" {% if user.role!='owner' %}style="display:none"{% endif %}>الإدارة</a></footer></div><script>
function noaCopy(value){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(value).then(()=>alert('تم النسخ')).catch(()=>prompt('انسخ النص:',value))}else{prompt('انسخ النص:',value)}}
document.querySelectorAll('input:not([type=password]):not([type=file]),textarea').forEach(el=>{if(el.type==='hidden'||el.type==='checkbox'||el.type==='radio')return;const b=document.createElement('button');b.type='button';b.className='outline small';b.textContent='نسخ';b.addEventListener('click',()=>noaCopy(el.value));el.insertAdjacentElement('afterend',b)});
document.querySelectorAll('.order-row').forEach(el=>{const b=document.createElement('button');b.type='button';b.className='outline small';b.textContent='نسخ البيانات';b.addEventListener('click',()=>noaCopy(el.innerText));el.appendChild(b)});
</script></body></html>
